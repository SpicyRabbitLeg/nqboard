spring:
  cache:
    type: redis # 缓存类型 Redis
  data:
    redis:
      database: 9
      host: 127.0.0.1
      port: 6379
      password:
  # 数据库相关配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
    url: jdbc:mysql://127.0.0.1:3306/nqboard?characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=GMT%2B8&allowMultiQueries=true&nullCatalogMeansCurrent=true

# 本地文件系统
file:
  local:
    enable: true
    base-path: /Users/lengleng/Downloads/img

## 登录配置
security:
  # 登录报文加密根密钥 ，必须是16位
  encodeKey: thanks,pig4cloud
  # 跳过验证码校验的客户端
  ignore-clients:
    - test

# 配置文件加密根密码
jasypt:
  encryptor:
    password: pig  # 加密根密码
    algorithm: PBEWithMD5AndDES  # 加密算法
    iv-generator-classname: org.jasypt.iv.NoIvGenerator # 无向量生成器

# 短信插件配置：https://www.yuque.com/vxixfq/pig/zw8udk
sms:
  is-print: false # 是否打印日志
  config-type: yaml # 配置类型，yaml


# Tushare 数据同步配置（同名配置可在 Nacos 中覆盖）
tushare:
  # token 属敏感信息，禁止硬编码
  token: xxxx
  daily:
    # 日线同步市场过滤：全部 / 主板 / 创业板 / 科创板（留空等价于"全部"）
    market: 全部
    # 是否全量获取：true = 2024-01-01 至今天；false = 仅增量获取今天
    full: false

# 中证指数成分股权重同步配置（官网 closeweight.xls）
csindex:
  # 待同步的指数代码列表（英文逗号分隔）
  indexes: 000300,000016,000905,000852,000500,000922
  # 权重文件下载地址模板，{} 替换为指数代码
  url: https://oss-ch.csindex.com.cn/static/html/csindex/public/uploads/file/autofile/closeweight/{}closeweight.xls