spring:
  cache:
    type: redis # 缓存类型 Redis
  data:
    redis:
      database: 9
      host: 127.0.0.1
      port: 6379
      password:
  # 数据库相关配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
    url: jdbc:mysql://127.0.0.1:3306/nqboard?characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=GMT%2B8&allowMultiQueries=true&nullCatalogMeansCurrent=true

# 本地文件系统
file:
  local:
    enable: true
    base-path: C:\Users\12709\Pictures\nqboard

## 登录配置
security:
  # 登录报文加密根密钥 ，必须是16位
  encodeKey: thanks,pig4cloud
  # 跳过验证码校验的客户端
  ignore-clients:
    - test

# 配置文件加密根密码
jasypt:
  encryptor:
    password: pig  # 加密根密码
    algorithm: PBEWithMD5AndDES  # 加密算法
    iv-generator-classname: org.jasypt.iv.NoIvGenerator # 无向量生成器

# 短信插件配置：https://www.yuque.com/vxixfq/pig/zw8udk
sms:
  is-print: false # 是否打印日志
  config-type: yaml # 配置类型，yaml


# dify配置项
dify:
  base-url: http://localhost/v1
  workflow-key: xxxx
  knowledge-api-key: 'xxxxx' # 知识库 API Key（dataset- 开头，Dify 控制台-知识库-API 获取）
  dataset-name: nqboard-专家画像 # 专家画像数据集名称（不存在时同步任务自动创建）

# 专家抽取配置项
extract:
  score-keep-threshold: 0.65 # rerank 高分直过阈值（实测无机化学边界人 0.641、有机核心 0.62-0.66，取 0.65 使边界人落入 LLM 复核；低分仍全送复核不自动弃）
  review-batch-size: 100 # LLM 复核每批人数
  review-concurrency: 4 # 复核批次并发数（在 Dify/LLM 服务端并发容量内调大可线性缩短复核时间）