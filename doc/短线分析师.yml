    - data:
        code: "function main({ technical, sector, money_flow, dragon_tiger, news })\
          \ {\n  const signals = { bullish: 1, bearish: -1, neutral: 0 };\n  const\
          \ agents = [];\n  const extract = (raw, key) => {\n    try {\n      let\
          \ s = String(raw).trim();\n      const m = s.match(/\\{[\\s\\S]*\\}/);\n\
          \      if (m) s = m[0];\n      return JSON.parse(s);\n    } catch (e) {\
          \ return null; }\n  };\n\n  for (const [key, raw] of [['technical', technical],\
          \ ['sector', sector],\n      ['money_flow', money_flow], ['dragon_tiger',\
          \ dragon_tiger]]) {\n    const parsed = extract(raw, key);\n    if (parsed\
          \ && parsed.key) agents.push({\n      key: parsed.key || key,\n      signal:\
          \ String(parsed.signal || 'n/a').toLowerCase(),\n      confidence: Number(parsed.confidence)\
          \ || 40,\n      reasoning: String(parsed.reasoning || '').slice(0, 200),\n\
          \    });\n  }\n\n  const newsParsed = extract(news, 'news');\n  if (newsParsed\
          \ && Array.isArray(newsParsed.agents)) {\n    for (const a of newsParsed.agents)\
          \ {\n      agents.push({\n        key: a.key,\n        signal: String(a.signal\
          \ || 'n/a').toLowerCase(),\n        confidence: Number(a.confidence) ||\
          \ 40,\n        reasoning: String(a.reasoning || '').slice(0, 200),\n   \
          \   });\n    }\n  }\n\n  const weights = { technical: 0.30, sector: 0.15,\
          \ money_flow: 0.15,\n    dragon_tiger: 0.10, news: 0.10, policy: 0.10 };\n\
          \  let score = 0, totalWeight = 0;\n  const reasons = [];\n  for (const\
          \ a of agents) {\n    const w = weights[a.key];\n    if (!w || a.signal\
          \ === 'n/a' || !a.signal) continue;\n    score += w * (signals[a.signal]\
          \ || 0) * (Math.min(100, Math.max(0, a.confidence)) / 100);\n    totalWeight\
          \ += w;\n    if (a.signal === 'bullish' && a.confidence >= 65) {\n     \
          \ reasons.push(({ technical: '技术面偏多', sector: '板块共振', money_flow: '主力净流入',\n\
          \        dragon_tiger: '龙虎榜净买', news: '舆情偏多', policy: '政策偏多' })[a.key] ||\
          \ a.key);\n    }\n  }\n\n  const weighted = totalWeight > 0 ? +(score /\
          \ totalWeight).toFixed(4) : 0;\n  const bullishCount = agents.filter(a =>\
          \ a.signal === 'bullish').length;\n  const strongBearish = agents.some(a\
          \ => a.signal === 'bearish' && a.confidence >= 70);\n  let action = 'watch';\n\
          \  if (strongBearish && weighted < 0) action = 'avoid';\n  else if (weighted\
          \ > 0 && bullishCount >= 2) action = 'entry_ok';\n  const confidence = Math.min(95,\
          \ Math.round(55 + Math.abs(weighted) * 45));\n\n  return {\n    result:\
          \ JSON.stringify({\n      action, confidence, weighted_score: weighted,\n\
          \      agents, reasons, risk_flags: [],\n    }),\n  };\n}"
